name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: 34.231.90.192
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 120s
          envs: OPENAI_API_KEY,TWILIO_ACCOUNT_SID,TWILIO_AUTH_TOKEN,TWILIO_PHONE_NUMBER,ADMIN_USER,ADMIN_PASSWORD
          script: |
            set -e

            # Pull latest code
            cd /home/ubuntu/app
            git pull origin main

            # Write .env — envs are passed as real env vars so special chars are safe
            {
              echo "APP_ENV=development"
              echo "BASE_URL=https://firstcall.help"
              echo "REDIS_HOST=localhost"
              echo "REDIS_SSL=false"
              echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
              echo "TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}"
              echo "TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}"
              echo "TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}"
              echo "ADMIN_USER=${ADMIN_USER}"
              echo "ADMIN_PASSWORD=${ADMIN_PASSWORD}"
            } > /home/ubuntu/app/.env

            # Sync any new dependencies
            /home/ubuntu/.local/bin/uv sync --no-dev --project /home/ubuntu/app

            # Restart app
            sudo systemctl restart firstcall
            sleep 3
            sudo systemctl is-active firstcall && echo "✅ firstcall is running"
